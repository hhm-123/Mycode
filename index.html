<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人名片</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 页面容器，负责让卡片在视口中居中展示 -->
    <main class="card-wrap">
      <!-- 名片主体 -->
      <section class="business-card">
        <!-- 顶部区域：头像 + 基本信息 -->
        <div class="card-header">
          <!-- 圆形头像 -->
          <div class="avatar" aria-label="头像" role="img">
            <span>林</span>
          </div>

          <div class="info">
            <!-- 名片标签 -->
            <p class="tag">个人名片</p>
            <h1>林晓岚</h1>
            <p class="job">UI / UX 设计师</p>
          </div>
        </div>

        <!-- 联系方式列表 -->
        <ul class="contact-list">
          <li><span class="label">邮箱</span><span>hello@linxiaolan.com</span></li>
          <li><span class="label">电话</span><span>+86 138 0000 0000</span></li>
          <li><span class="label">地址</span><span>上海市浦东新区</span></li>
        </ul>
      </section>
    </main>
  </body>
</html>
